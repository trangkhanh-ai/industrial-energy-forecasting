<div id="lights-state-comparison" aria-live="polite">
  <h2>So sánh khi lights = 0 và lights &gt; 0</h2>
  <div class="lights-viz-grid">
    <section aria-labelledby="appliance-title">
      <h3 id="appliance-title">Appliances_lag_0 - trung bình (Wh)</h3>
      <svg class="lights-chart" id="appliance-chart" role="img" aria-label="Biểu đồ so sánh Appliances_lag_0 trung bình giữa hai nhóm lights"></svg>
    </section>
    <section aria-labelledby="effect-title">
      <h3 id="effect-title">Cỡ ảnh hưởng chuẩn hóa - Cohen's d</h3>
      <svg class="lights-chart" id="effect-chart" role="img" aria-label="Cỡ ảnh hưởng chuẩn hóa của trạng thái lights lên Appliances_lag_0 và nhiệt độ T1 đến T9"></svg>
    </section>
  </div>
</div>
<style>
  #lights-state-comparison { color: var(--foreground); }
  #lights-state-comparison h2, #lights-state-comparison h3 { margin: 0 0 0.5rem; font-weight: 500; }
  #lights-state-comparison h3 { color: var(--muted-foreground); }
  .lights-viz-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  .lights-chart { display: block; width: 100%; min-height: 370px; overflow: visible; }
  .lights-chart text { fill: var(--foreground); font-size: 12px; }
  .lights-chart .axis-title { fill: var(--muted-foreground); }
  .lights-chart .grid line { stroke: var(--border); }
  .lights-chart .domain, .lights-chart .tick line { stroke: var(--border); }
  .lights-chart .zero-line { stroke: var(--muted-foreground); }
  @media (max-width: 640px) { .lights-viz-grid { grid-template-columns: 1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const appliance = [
    { group: "lights = 0", value: 86.58, n: 15249, color: "var(--viz-series-1)" },
    { group: "lights > 0", value: 135.33, n: 4480, color: "var(--viz-series-2)" }
  ];
  const effects = [
    { feature: "Appliances_lag_0", d: 0.485, diff: 48.75 },
    { feature: "T1", d: -0.102, diff: -0.16 },
    { feature: "T2", d: -0.045, diff: -0.10 },
    { feature: "T3", d: -0.270, diff: -0.54 },
    { feature: "T4", d: -0.090, diff: -0.18 },
    { feature: "T5", d: -0.213, diff: -0.39 },
    { feature: "T6", d: -0.206, diff: -1.25 },
    { feature: "T7", d: -0.335, diff: -0.70 },
    { feature: "T8", d: -0.184, diff: -0.36 },
    { feature: "T9", d: -0.408, diff: -0.81 }
  ];
  const color = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  function drawAppliance() {
    const svg = d3.select('#appliance-chart');
    const width = Math.max(svg.node().clientWidth, 320), height = 370;
    const margin = { top: 20, right: 24, bottom: 58, left: 54 };
    svg.attr('viewBox', `0 0 ${width} ${height}`).selectAll('*').remove();
    const x = d3.scaleBand().domain(appliance.map(d => d.group)).range([margin.left, width - margin.right]).padding(0.36);
    const y = d3.scaleLinear().domain([0, 150]).nice().range([height - margin.bottom, margin.top]);
    svg.append('rect').attr('data-chart-frame', '').attr('x', margin.left).attr('y', margin.top).attr('width', width-margin.left-margin.right).attr('height', height-margin.top-margin.bottom).attr('fill', 'none').attr('stroke', color('--border'));
    svg.append('g').attr('class', 'grid').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(width-margin.left-margin.right)).tickFormat(''));
    svg.append('g').attr('transform', `translate(0,${height-margin.bottom})`).call(d3.axisBottom(x));
    svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5));
    svg.selectAll('rect.bar').data(appliance).join('rect').attr('class','bar').attr('x', d => x(d.group)).attr('y', d => y(d.value)).attr('width', x.bandwidth()).attr('height', d => y(0)-y(d.value)).attr('fill', d => color(d.group === 'lights = 0' ? '--viz-series-1' : '--viz-series-2')).attr('data-tooltip', d => `${d.group}: ${d.value.toFixed(2)} Wh; n = ${d.n.toLocaleString()}`);
    svg.selectAll('text.value').data(appliance).join('text').attr('class','value').attr('x', d => x(d.group)+x.bandwidth()/2).attr('y', d => y(d.value)-8).attr('text-anchor','middle').text(d => `${d.value.toFixed(1)} Wh`);
    svg.append('text').attr('class','axis-title').attr('x', 16).attr('y', height/2).attr('transform', `rotate(-90 16 ${height/2})`).attr('text-anchor','middle').text('Wh');
  }
  function drawEffects() {
    const svg = d3.select('#effect-chart');
    const width = Math.max(svg.node().clientWidth, 320), height = 370;
    const margin = { top: 20, right: 52, bottom: 58, left: 108 };
    svg.attr('viewBox', `0 0 ${width} ${height}`).selectAll('*').remove();
    const x = d3.scaleLinear().domain([-0.5, 0.6]).range([margin.left, width-margin.right]);
    const y = d3.scaleBand().domain(effects.map(d => d.feature)).range([margin.top, height-margin.bottom]).padding(0.42);
    svg.append('rect').attr('data-chart-frame', '').attr('x', margin.left).attr('y', margin.top).attr('width', width-margin.left-margin.right).attr('height', height-margin.top-margin.bottom).attr('fill', 'none').attr('stroke', color('--border'));
    svg.append('g').attr('class','grid').attr('transform', `translate(0,${height-margin.bottom})`).call(d3.axisBottom(x).ticks(5).tickSize(-(height-margin.top-margin.bottom)).tickFormat(''));
    svg.append('line').attr('class','zero-line').attr('x1',x(0)).attr('x2',x(0)).attr('y1',margin.top).attr('y2',height-margin.bottom);
    svg.append('g').attr('transform', `translate(0,${height-margin.bottom})`).call(d3.axisBottom(x).ticks(5));
    svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).tickSize(0));
    svg.selectAll('line.effect').data(effects).join('line').attr('x1',x(0)).attr('x2',d=>x(d.d)).attr('y1',d=>y(d.feature)+y.bandwidth()/2).attr('y2',d=>y(d.feature)+y.bandwidth()/2).attr('stroke', color('--muted-foreground')).attr('stroke-width',1.5);
    svg.selectAll('circle.effect').data(effects).join('circle').attr('cx',d=>x(d.d)).attr('cy',d=>y(d.feature)+y.bandwidth()/2).attr('r',5).attr('fill',d=>d.feature==='Appliances_lag_0'?color('--viz-series-2'):color('--viz-series-1')).attr('data-tooltip', d => `${d.feature}: d = ${d.d.toFixed(3)}; chênh lệch trung bình = ${d.diff > 0 ? '+' : ''}${d.diff.toFixed(2)} ${d.feature === 'Appliances_lag_0' ? 'Wh' : '°C'}`);
    svg.append('text').attr('class','axis-title').attr('x',(margin.left+width-margin.right)/2).attr('y',height-10).attr('text-anchor','middle').text("Cohen's d (dương: lights > 0 cao hơn)");
  }
  const redraw = () => { drawAppliance(); drawEffects(); };
  new ResizeObserver(redraw).observe(document.getElementById('lights-state-comparison'));
  redraw();
})();
</script>
